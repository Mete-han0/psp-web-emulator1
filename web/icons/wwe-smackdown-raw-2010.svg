<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300"
     role="img" aria-label="WWE SmackDown vs. RAW 2010">
  <defs>
    <linearGradient id="splitbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#0b1d4a"/>
      <stop offset=".48" stop-color="#101a33"/>
      <stop offset=".52" stop-color="#3a0810"/>
      <stop offset="1"   stop-color="#6d0f1a"/>
    </linearGradient>
    <linearGradient id="rawbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sdbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d9bff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#4d9bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beltgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d98a"/>
      <stop offset=".5" stop-color="#c99b3a"/>
      <stop offset="1" stop-color="#8f6a1e"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#splitbg)"/>
  <path d="M100 0 L156 240 L44 240 Z" fill="url(#sdbeam)"/>
  <path d="M300 0 L244 240 L356 240 Z" fill="url(#rawbeam)"/>

  <!-- ring -->
  <path d="M0 240 L400 240 L400 300 L0 300 Z" fill="#161a20"/>
  <path d="M0 240 L28 218 H372 L400 240 Z" fill="#3a3f47"/>
  <g stroke="#e02b3a" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M28 172 H372"/><path d="M28 196 H372"/>
  </g>
  <g stroke="#2f6fd0" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M28 218 H372"/>
  </g>
  <g fill="#c8ccd2">
    <rect x="20" y="156" width="12" height="84" rx="4"/>
    <rect x="368" y="156" width="12" height="84" rx="4"/>
  </g>

  <!-- championship belt, centre, tilted -->
  <g transform="translate(200 96) rotate(-7)">
    <rect x="-118" y="-16" width="236" height="32" rx="6" fill="#1b1e24"/>
    <rect x="-118" y="-16" width="236" height="32" rx="6" fill="none" stroke="#3c4149" stroke-width="2"/>
    <g fill="#c9ccd2">
      <circle cx="-96" cy="0" r="3"/><circle cx="96" cy="0" r="3"/>
      <circle cx="-72" cy="-11" r="3"/><circle cx="72" cy="-11" r="3"/>
      <circle cx="-72" cy="11" r="3"/><circle cx="72" cy="11" r="3"/>
    </g>
    <!-- centre plate -->
    <path d="M-46 -24 L46 -24 L54 0 L46 24 L-46 24 L-54 0 Z" fill="url(#beltgold)"/>
    <path d="M-46 -24 L46 -24 L54 0 L46 24 L-46 24 L-54 0 Z" fill="none" stroke="#6e5316" stroke-width="2"/>
    <!-- embossed globe -->
    <g fill="none" stroke="#6e5316" stroke-width="2" opacity=".8">
      <circle cx="0" cy="0" r="12"/>
      <ellipse cx="0" cy="0" rx="5" ry="12"/>
      <path d="M-12 0 H12"/>
    </g>
  </g>

  <!-- wrestlers -->
  <g fill="#07090c">
    <g transform="translate(150 240)">
      <circle cx="0" cy="-98" r="14"/>
      <path d="M-16 -84 q16 -11 32 0 l9 40 -13 5 -5 -24 -4 58 h-19 l-4 -58 -5 24 -13 -5 Z"/>
    </g>
    <g transform="translate(252 240)">
      <circle cx="0" cy="-98" r="14"/>
      <path d="M16 -84 q-16 -11 -32 0 l-9 40 13 5 5 -24 4 58 h19 l4 -58 5 24 13 -5 Z"/>
    </g>
  </g>
</svg>