<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300"
     role="img" aria-label="Final Fantasy Tactics: The War of the Lions">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset=".6" stop-color="#16233d"/>
      <stop offset="1" stop-color="#1f3358"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dceaff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7fa8e0" stop-opacity=".1"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa6bd"/>
      <stop offset=".45" stop-color="#e8f0f8"/>
      <stop offset="1" stop-color="#6f8399"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#field)"/>
  <circle cx="286" cy="80" r="72" fill="url(#moon)"/>
  <circle cx="286" cy="80" r="26" fill="#e8f0fb" opacity=".85"/>

  <!-- isometric grid -->
  <g stroke="#4d7ab5" stroke-width="1.6" opacity=".45">
    <path d="M0 214 L400 128 M0 250 L400 164 M0 286 L400 200"/>
    <path d="M60 300 L400 244 M0 178 L340 300 M0 142 L260 300 M0 106 L180 300"/>
  </g>

  <!-- two facing units on the grid -->
  <!-- left: knight with sword -->
  <g transform="translate(140 206)">
    <path d="M0 0 L-34 22 L-34 44 L34 44 L34 22 Z" fill="#2c4b7a" stroke="#6ea3e0" stroke-width="2"/>
    <!-- sword, raised -->
    <path d="M26 18 L74 -44 l9 9 -50 60 Z" fill="url(#steel)"/>
    <path d="M20 12 l14 12 -7 9 -14 -13 Z" fill="#c9a227"/>
    <circle cx="-4" cy="-8" r="9" fill="#2c4b7a" stroke="#6ea3e0" stroke-width="2"/>
    <path d="M-4 -17 v-8 h8" fill="none" stroke="#c9a227" stroke-width="3"/>
  </g>
  <!-- right: opposing figure -->
  <g transform="translate(268 172)">
    <path d="M0 0 L-32 20 L-32 42 L32 42 L32 20 Z" fill="#5a2434" stroke="#c46a7a" stroke-width="2"/>
    <circle cx="0" cy="-8" r="9" fill="#5a2434" stroke="#c46a7a" stroke-width="2"/>
    <path d="M-30 16 L-64 -18 l8 -8 34 34 Z" fill="url(#steel)"/>
  </g>

  <!-- conflict spark between them -->
  <g stroke="#ffd166" stroke-width="3.4" opacity=".9" stroke-linecap="round">
    <path d="M198 196 l10 -12 M204 208 l14 -6 M196 182 l4 -14 M212 214 l10 8"/>
  </g>

  <!-- foreground ledge -->
  <path d="M0 264 L400 216 L400 300 L0 300 Z" fill="#0a1220"/>
  <path d="M0 264 L400 216" stroke="#3d5f94" stroke-width="2" opacity=".8"/>
</svg>