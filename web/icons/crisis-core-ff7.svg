<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300"
     role="img" aria-label="Crisis Core: Final Fantasy VII">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04101c"/>
      <stop offset=".55" stop-color="#0a2033"/>
      <stop offset="1" stop-color="#123047"/>
    </linearGradient>
    <radialGradient id="mako" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a8ffe8" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#2ee6b6" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0f8f78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff6ff"/>
      <stop offset=".5" stop-color="#7fd4ff"/>
      <stop offset="1" stop-color="#3f7fa8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Midgar plate ruins -->
  <g fill="#071a26">
    <rect x="0" y="196" width="70" height="104"/>
    <rect x="84" y="176" width="54" height="124"/>
    <rect x="150" y="206" width="62" height="94"/>
    <rect x="300" y="182" width="60" height="118"/>
    <rect x="368" y="200" width="40" height="100"/>
  </g>
  <!-- plate leg -->
  <rect x="196" y="80" width="26" height="220" fill="#08202e"/>
  <rect x="182" y="66" width="54" height="18" rx="4" fill="#0a2a3c"/>

  <!-- mako pools -->
  <circle cx="112" cy="252" r="56" fill="url(#mako)"/>
  <circle cx="330" cy="246" r="48" fill="url(#mako)"/>
  <circle cx="112" cy="252" r="16" fill="#c9fff2" opacity=".8"/>
  <circle cx="330" cy="246" r="13" fill="#c9fff2" opacity=".7"/>

  <!-- rising energy wisps -->
  <g stroke="#2ee6b6" stroke-width="2.6" fill="none" opacity=".5" stroke-linecap="round">
    <path d="M112 214 q-10 -22 2 -40"/><path d="M330 210 q10 -20 -2 -36"/>
    <path d="M60 250 q-8 -18 2 -34"/>
  </g>

  <!-- Buster Sword, angled across -->
  <g transform="translate(150 168) rotate(-24)">
    <path d="M-16 8 L150 -14 L162 2 L150 22 L-16 30 Z" fill="url(#blade)"/>
    <path d="M-16 8 L150 -14 L154 -2 L-16 18 Z" fill="#ffffff" opacity=".45"/>
    <circle cx="-30" cy="-14" r="9" fill="#2b3a4a"/>
    <rect x="-40" y="-4" width="30" height="18" rx="3" fill="#3b4c5e"/>
    <circle cx="-42" cy="-8" r="5" fill="#6a7f94"/>
    <circle cx="-42" cy="18" r="5" fill="#6a7f94"/>
    <rect x="-14" y="10" width="18" height="16" rx="2" fill="#c9a227"/>
  </g>

  <!-- sparks on the edge -->
  <g fill="#dff6ff" opacity=".8">
    <circle cx="326" cy="112" r="2.5"/><circle cx="342" cy="128" r="1.8"/>
    <circle cx="308" cy="132" r="2"/><circle cx="60" cy="120" r="2.2"/>
    <circle cx="44" cy="138" r="1.6"/>
  </g>
</svg>